name: Build Winimeku Apps
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '17' }
      
      - name: Build Wibinime APK
        run: |
          cd apps/wibinime
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Build Developer Console APK
        run: |
          cd apps/developer-console
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: Winimeku-APKs
          path: |
            apps/wibinime/app/build/outputs/apk/debug/app-debug.apk
            apps/developer-console/app/build/outputs/apk/debug/app-debug.apk
